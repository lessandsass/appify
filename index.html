<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appify</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header class="main-header">
        <div class="container grid">

            <div class="logo col">
                <img src="/img/logo.svg" alt="Appify Logo">
            </div>

            <nav class="main-nav col">
                <ul class="nav-list">
                    <li><a href="#">Home</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Blog</a></li>
                    <li><a href="">Pricing</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <!-- ##### Hero Area ##### -->
    <section class="hero">
        <div class="container grid">
            <div class="hero-text col">
                <h1 class="title-large">Take your app to the Next Level</h1>
                <p class="intro">The perfect landing page for your app, whatever it might be. Show off the apps features, show some sexy pictures and get more people do download it today.</p>
                <button class="btn btn--secondary">Learn more</button>
                <button class="btn btn--primary">Get the app</button>
            </div>

            <div class="col">
                <img src="img/phone.png" alt="hero image as app on a phone" class="hero-img">
            </div>

        </div>
    </section>

    <!-- ##### Sales Points ##### -->
    <section class="sales-points">
        <div class="container grid">
            <h2>Promote your app</h2>
            <div class="sales-point col">
                <img src="img/sales-responsive.png" alt="">
                <h3></h3>
                <p></p>
            </div>
            <div class="sales-point col">
                <img src="img/sales-hand.png" alt="">
                <h3></h3>
                <p></p>
            </div>
            <div class="sales-point col">
                <img src="img/sales-graph.png" alt="">
                <h3></h3>
                <p></p>
            </div>
        </div>
    </section>

</body>
</html>
